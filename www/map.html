<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pet Hotel Map - Chiang Mai</title>

    <!-- โหลด Bootstrap 6 Alpha -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <!-- โหลด Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <link rel="stylesheet" href="style.css">

    <style>
        #map {
            height: 75vh;
            width: 100%;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarTogglerDemo01"
                aria-labelledby="navbarTogglerDemo01Label">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarTogglerDemo01Label">Pet Hotel Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">


                    <ul class="navbar-nav me-auto mb-2 md:mb-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="reviews.html">Reviews</a>

                        <li class="nav-item">
                            <a class="nav-link active" href="map.html">Map</a>

                        </li>
                    </ul>

                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />

                    </form>
                </div>
            </dialog>

    <!-- ส่วนแสดงแผนที่ -->
    <div class="container">
        <h2 class="mt-4">แผนที่แสดงตำแหน่งโรงแรมรับฝากสัตว์เลี้ยงในอำเภอเมืองเชียงใหม่</h2>
        <p class="text-muted">คลิกที่หมุดเพื่อดูชื่อโรงแรม หรือเลือกเปลี่ยนรูปแบบเลเยอร์แผนที่ได้ที่มุมขวาบน</p>

        <!-- กล่องแสดงแผนที่ -->
        <div id="map"></div>
    </div>

    <!-- โหลด Leaflet JS และ Bootstrap JS ผ่าน CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <!-- โค้ดแผนที่และหมุดทั้งหมด 18 แห่งของคุณ -->
    <script>
        var map = new L.map("map", {
            center: [18.7886128653474, 98.98923869911839],
            zoom: 15
        });

        var osm = new L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'xx'
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        var OpenTopoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data: &copy; OpenStreetMap contributors'
        });

        var OpenStreetMap_DE = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        // รายชื่อหมุดทั้ง 18 แห่ง
        var marker1 = new L.marker([18.7963034891110, 98.9792824667375]).bindPopup("Cat Hotel BaanNongPin");
        var marker2 = new L.marker([18.7999475290763, 98.9806305693132]).bindPopup("Cat Inn");
        var marker3 = new L.marker([18.8115289381429, 98.9582455576716]).bindPopup("What a Cat ? Grooming & Hotels");
        var marker4 = new L.marker([18.8068548767817, 98.9963277153433]).bindPopup("Ploy Grooming & Pet Shop");
        var marker5 = new L.marker([18.7660142529842, 98.9919723423282]).bindPopup("Cabbits Hotel and Grooming");
        var marker6 = new L.marker([18.7648364714136, 98.9933428865075]).bindPopup("Cat Spaces Grooming & Hotel");
        var marker7 = new L.marker([18.7456548542428, 98.9792591306868]).bindPopup("Royal Cat Grooming & Hotel");
        var marker8 = new L.marker([18.7701407142088, 98.9769396086723]).bindPopup("Cat Castle");
        var marker9 = new L.marker([18.7908226681332, 99.0049038693132]).bindPopup("Ketawa Pet Friendly Hotel and Cafe");
        var marker10 = new L.marker([18.8441432908407, 98.9959979153434]).bindPopup("บ้านแมวมีโชค cat hotel");
        var marker11 = new L.marker([18.8101960315235, 99.0142762111455]).bindPopup("Cat Cottage");
        var marker12 = new L.marker([18.7986306480796, 99.0242918244093]).bindPopup("WINK Grooming & Hotel cat");
        var marker13 = new L.marker([18.7899168659376, 98.9588366109166]).bindPopup("Cat Hotel (บ้านแมว เชียงใหม่)");
        var marker14 = new L.marker([18.8525434849456, 99.0064695992462]).bindPopup("The Cat Nap Chiangmai");
        var marker15 = new L.marker([18.8090013848751, 98.9936922755674]).bindPopup("Happy Home Pet ");
        var marker16 = new L.marker([18.7702946735958, 99.0398941822902]).bindPopup("Midnight Cat Hotel");
        var marker17 = new L.marker([18.7787227743843, 98.9581287246198]).bindPopup("Catlony Cat hotel Chiangmai");
        var marker18 = new L.marker([18.8153278328488, 98.9759534381075]).bindPopup("MeowCat Hotel Chiang Mai");

        var baseMap = {
            "Esri_WorldImagery": Esri_WorldImagery.addTo(map),
            "osm": osm,
            "OpenTopoMap": OpenTopoMap.addTo(map),
            "OpenStreetMap_DE": OpenStreetMap_DE.addTo(map)
        };

        var overlay = {
            "Cat Hotel BaanNongPin": marker1.addTo(map),
            "Cat Inn": marker2.addTo(map),
            "What a Cat ? Grooming & Hotels": marker3.addTo(map),
            "Ploy Grooming & Pet Shop": marker4.addTo(map),
            "Cabbits Hotel and Grooming": marker5.addTo(map),
            "Cat Spaces Grooming & Hotel": marker6.addTo(map),
            "Royal Cat Grooming & Hotel": marker7.addTo(map),
            "Cat Castle": marker8.addTo(map),
            "Ketawa Pet Friendly Hotel and Cafe": marker9.addTo(map),
            "บ้านแมวมีโชค cat hotel": marker10.addTo(map),
            "Cat Cottage": marker11.addTo(map),
            "WINK Grooming & Hotel cat": marker12.addTo(map),
            "Cat Hotel (บ้านแมว เชียงใหม่)": marker13.addTo(map),
            "The Cat Nap Chiangmai": marker14.addTo(map),
            "Happy Home Pet ": marker15.addTo(map),
            "Midnight Cat Hotel": marker16.addTo(map),
            "Catlony Cat hotel Chiangmai": marker17.addTo(map),
            "MeowCat Hotel Chiang Mai": marker18.addTo(map)
        };

        L.control.layers(baseMap, overlay).addTo(map);
    </script>
</body>

</html>
